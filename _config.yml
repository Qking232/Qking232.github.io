# Jekyll configuration for qking232.github.io
# Theme: Jasper2 — https://github.com/jekyllt/jasper2 (MIT)

markdown: kramdown
highlighter: rouge
paginate: 5
language: 'en-uk'
words_per_minute: 200

# This is a root user site, so baseurl must be "/". The theme writes asset and
# navigation links as "{{ site.baseurl }}assets/...", which only resolve
# correctly (on nested pages like /about/ and /tag/x/) when baseurl carries a
# leading slash. An empty baseurl would make those links relative and 404.
url: "https://qking232.github.io"
baseurl: "/"

# Website info
title: Qking232
description: Personal website.
cover: assets/images/blog-cover.jpg
logo:
logo_dark:
favicon: assets/images/favicon.png

# Social info (blank = hidden)
navigation: True
subscribers: True
twitter:
facebook:

# Disqus / Google Analytics (disabled)
disqus: False
disqus_shortname:
google_analytics:

# Permalinks
permalink: /:title

# Plugins (Jasper2 ships Ruby plugins in _plugins/ for tag & author pages)
plugins_dir: [_plugins]
plugins: [jekyll-paginate, jekyll-feed]

feed:
  path: feed.xml

# Front matter defaults, so the theme's required front matter survives editing
# through the CMS even if the CMS writes only the fields it knows about.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      current: post
      navigation: true
      class: post-template
      subclass: 'post'
      author: qking232
  - scope:
      path: "about"
    values:
      layout: page
      current: about
      navigation: true
      class: page-template
      subclass: 'post page'

safe: False
lsi: False

exclude:
  - assets/css
  - node_modules
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - package.json
  - package-lock.json
  - Rakefile
  - gulpfile.js
  - script.py
  - "*.Rmd"
  - .git*
