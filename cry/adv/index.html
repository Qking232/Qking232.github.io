<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantitative Crypto Swing Advisor &middot; Authenticate</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&Omega;</text></svg>">
<style>
  :root {
    --bg: #000000;
    --card: #08090c;
    --border: rgba(255, 255, 255, 0.12);
    --text: #f1f2f5;
    --dim: #717684;
    --muted: #a0a4b0;
    --green: #34d399;
    --red: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .lock-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 28px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.9);
  }
  .lock-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .lock-glyph {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: #14151d;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }
  h1 {
    font-size: 16px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  .sub {
    font-size: 12.5px;
    color: var(--dim);
    line-height: 1.5;
    margin-bottom: 22px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
  }
  label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  input[type="password"] {
    background: #000000;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s ease;
  }
  input[type="password"]:focus {
    border-color: var(--text);
  }
  button {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    background: #f1f2f5;
    color: #000000;
    font-weight: 650;
    font-size: 13px;
    border: none;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover {
    background: #ffffff;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .status {
    margin-top: 14px;
    font-size: 12px;
    text-align: center;
    min-height: 18px;
  }
  .status.err { color: var(--red); }
  .status.ok { color: var(--green); }
  .status.busy { color: var(--muted); }
  .meta-tag {
    margin-top: 24px;
    padding-top: 14px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    font-size: 11px;
    color: var(--dim);
    display: flex;
    justify-content: space-between;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
</style>
</head>
<body>
<div class="lock-card" id="lockCard">
  <div class="lock-head">
    <div class="lock-glyph">&#128274;</div>
    <div>
      <h1>Quantum Alpha Advisor</h1>
    </div>
  </div>
  <p class="sub">Encrypted institutional swing trading portfolio. Enter your master password to decrypt and launch.</p>
  <form id="authForm">
    <div class="field">
      <label for="pwd">Master Password</label>
      <input type="password" id="pwd" placeholder="Enter password&hellip;" autocomplete="current-password" autofocus required>
    </div>
    <button type="submit" id="btnUnlock">Unlock Advisor</button>
  </form>
  <div class="status" id="statusMsg"></div>
  <div class="meta-tag">
    <span>AES-256-GCM &middot; PBKDF2</span>
    <span>Zero-Knowledge</span>
  </div>
</div>

function hexToBytes(hex) {
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < hex.length; i += 2) {
    bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
  }
  return bytes;
}

async function decryptPayload(password) {
  const enc = new TextEncoder();
  const pwBytes = enc.encode(password);
  const salt = hexToBytes(PAYLOAD.salt);
  const iv = hexToBytes(PAYLOAD.iv);
  const tag = hexToBytes(PAYLOAD.tag);
  const ciphertext = hexToBytes(PAYLOAD.data);

  // Combine ciphertext and auth tag for WebCrypto AES-GCM
  const combined = new Uint8Array(ciphertext.length + tag.length);
  combined.set(ciphertext, 0);
  combined.set(tag, ciphertext.length);

  // Import key material for PBKDF2
  const keyMaterial = await crypto.subtle.importKey(
    'raw', pwBytes, 'PBKDF2', false, ['deriveKey']
  );

  // Derive AES-GCM key using 100,000 iterations of SHA-256
  const aesKey = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );

  // Decrypt in RAM
  const decrypted = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: iv, tagLength: 128 },
    aesKey,
    combined
  );

  const dec = new TextDecoder();
  return dec.decode(decrypted);
}

function launchApp(html, pwd) {
  try {
    sessionStorage.setItem('__CRY_ADV_PWD__', pwd);
  } catch (e) {}

  document.open();
  document.write(html);
  document.close();
}

const form = document.getElementById('authForm');
const pwdInput = document.getElementById('pwd');
const btn = document.getElementById('btnUnlock');
const statusMsg = document.getElementById('statusMsg');

form.addEventListener('submit', async function(e) {
  e.preventDefault();
  const pwd = pwdInput.value;
  if (!pwd) return;

  btn.disabled = true;
  statusMsg.className = 'status busy';
  statusMsg.textContent = 'Verifying key & decrypting in memory…';

  try {
    const decryptedHtml = await decryptPayload(pwd);
    statusMsg.className = 'status ok';
    statusMsg.textContent = '✓ Decryption successful. Launching…';
    setTimeout(() => launchApp(decryptedHtml, pwd), 150);
  } catch (err) {
    statusMsg.className = 'status err';
    statusMsg.textContent = '✗ Invalid password or corrupted payload.';
    btn.disabled = false;
    pwdInput.value = '';
    pwdInput.focus();
  }
});

// Auto-unlock if session password was previously saved in sessionStorage
(async function checkSession() {
  try {
    const saved = sessionStorage.getItem('__CRY_ADV_PWD__');
    if (saved) {
      statusMsg.className = 'status busy';
      statusMsg.textContent = 'Session detected. Unlocking…';
      const decryptedHtml = await decryptPayload(saved);
      launchApp(decryptedHtml, saved);
    }
  } catch (e) {}
})();
